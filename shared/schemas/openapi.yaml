openapi: 3.1.0
info:
  title: Global Market AI Insight API
  version: 1.0.0
  description: Asynchronous owner-only educational market insight API. AWS_IAM SigV4 plus an exact gateway IAM owner context is required; local fixtures are separate. Gateway-native 403 responses can precede the application error envelope.
servers:
  - url: /v1
security:
  - AwsSigV4: []
components:
  securitySchemes:
    AwsSigV4:
      type: apiKey
      name: Authorization
      in: header
      description: AWS Signature Version 4 with temporary credentials, used by the operator outside the browser. The controller additionally checks the configured owner.
      x-amazon-apigateway-authtype: awsSigv4
  responses:
    AccessDenied:
      description: Gateway IAM denial or application ACCESS_DENIED. A gateway-native response may not use the application envelope.
paths:
  /assets:
    get:
      operationId: listAssets
      responses:
        "200":
          description: Supported asset catalog
        "403":
          $ref: '#/components/responses/AccessDenied'
  /jobs:
    post:
      operationId: createJob
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./create-job.request.schema.json
      responses:
        "202":
          description: Job accepted or idempotently replayed
          content:
            application/json:
              schema:
                $ref: ./accepted-job.schema.json
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: ./error.schema.json }
        "403":
          $ref: '#/components/responses/AccessDenied'
        "409":
          description: Conflicting idempotency key
          content:
            application/json:
              schema: { $ref: ./error.schema.json }
        "503":
          description: Circuit open or worker launch unavailable
          content:
            application/json:
              schema: { $ref: ./error.schema.json }
  /jobs/{jobId}:
    get:
      operationId: getJob
      parameters:
        - in: path
          name: jobId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Current job state or result
          content:
            application/json:
              schema:
                $ref: ./job-response.schema.json
        "404":
          description: Job not found
          content:
            application/json:
              schema: { $ref: ./error.schema.json }
        "403":
          $ref: '#/components/responses/AccessDenied'
  /health:
    get:
      operationId: getHealth
      description: Controller and circuit state only; never launches work.
      responses:
        "200": { description: Controller health and circuit state }
        "403":
          $ref: '#/components/responses/AccessDenied'
